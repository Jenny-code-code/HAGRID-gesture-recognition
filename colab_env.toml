[project]
name = "hagrid-yolov5-demo"
python = ">=3.9"
description = "Colab dependencies and artifact paths for the HAGRID YOLOv5 inference demo notebook."

[pip]
# Colab already provides torch/torchvision with a CUDA build that matches the runtime.
# Avoid pinning torch here unless you have a specific reason to replace Colab's GPU stack.
packages = [
  "ultralytics==8.2.64",
  "gitpython>=3.1.30",
  "matplotlib==3.8.4",
  "numpy==1.26.4",
  "opencv-python-headless==4.10.0.84",
  "pillow==11.3.0",
  "psutil",
  "PyYAML>=5.3.1",
  "scipy==1.13.1",
  "thop>=0.1.1",
  "tqdm>=4.66.3",
  "pandas==2.2.2",
  "seaborn==0.13.2",
  "packaging",
  "setuptools>=70.0.0"
]

[paths]
# These paths are relative to the demo project root in Colab.
default_image_dir = "datasets/HAGRID-YOLO/test/images"
single_image_dir = "assets/inference_images"
curated_image_dir = "assets/curated_test_set"
data_yaml = "datasets/HAGRID-YOLO/data.yaml"
weights = "artifacts/runs/train/exp_batchsize_32/weights/best.pt"
yolov5_runtime = "yolov5_runtime"

[artifacts]
# Option A: upload/copy the whole demo folder including artifacts/runs/train/exp_batchsize_32/weights/best.pt.
# Option B: put a Google Drive file id here and let the Colab setup cell download it with gdown.
weights_google_drive_file_id = ""
weights_download_url = ""
